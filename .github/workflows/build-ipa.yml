---
name: Build iOS IPA

'on':
  workflow_dispatch:
    inputs:
      build_name:
        description: >-
          Optional custom version name (e.g. 2.0.2 - leaves
          pubspec.yaml default if blank)
        required: false
        type: string
      build_number:
        description: >-
          Optional custom build number (e.g. 224 - leaves
          pubspec.yaml default if blank)
        required: false
        type: string

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build Sideloadable IPA
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        # actions/checkout v6
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          sudo xcodebuild -runFirstLaunch
          xcodebuild -version
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -showdestinations || true

      - name: Set Up Flutter
        # subosito/flutter-action v2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Configure Flutter & Verify Toolchain
        run: |
          flutter config --no-enable-swift-package-manager
          flutter doctor -v

      - name: Install Flutter Dependencies
        run: |
          flutter precache --ios
          flutter pub get

      - name: Setup CocoaPods Dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS App (Unsigned for Sideloading)
        run: |
          # Disable code signing for all configurations so no Development
          # Team / Provisioning Profile is required for a sideloadable build.
          python3 -c "import re; p='ios/Runner.xcodeproj/project.pbxproj'; s=open(p).read(); s=re.sub(r'CODE_SIGNING_ALLOWED = [A-Za-z]+;', 'CODE_SIGNING_ALLOWED = NO;', s); s=re.sub(r'(buildSettings = \{)(?!\s*CODE_SIGNING)', r'\1\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tCODE_SIGN_STYLE = Manual;', s); s=re.sub(r'DEVELOPMENT_TEAM = [^;]*;', 'DEVELOPMENT_TEAM = AAAAAAAAAA;', s); open(p,'w').write(s); print('signing configs:', s.count('CODE_SIGNING_ALLOWED = NO;'), 'teams:', s.count('DEVELOPMENT_TEAM = AAAAAAAAAA;'))"

          EXTRA_ARGS=""
          if [ -n "${{ inputs.build_name }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --build-name=${{ inputs.build_name }}"
          fi
          if [ -n "${{ inputs.build_number }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --build-number=${{ inputs.build_number }}"
          fi

          # Flutter 3.47's device build demands a Development Team even with
          # --no-codesign. Supply a placeholder via the variable Flutter reads,
          # so its check passes; --no-codesign keeps Xcode from really signing.
          # The resulting unsigned .app is re-signed later by the sideload tool.
          export FLUTTER_XCODE_DEVELOPMENT_TEAM=AAAAAAAAAA

          flutter build ios --release --no-codesign \
            --dart-define=FLAVOR=community \
            --dart-define=OFFICIAL_BUILD=true \
            --dart-define=IPA_BUILD=true \
            $EXTRA_ARGS

          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            echo "ERROR: Runner.app was not produced by Xcode build"
            exit 1
          fi
          echo "Runner.app exists; continuing to package unsigned IPA"

      - name: Package Sideloadable IPA
        run: |
          ROOT_DIR="$PWD"
          STAGING_DIR="$ROOT_DIR/build/ios/ipa_staging"
          PAYLOAD_DIR="$STAGING_DIR/Payload"
          OUTPUT_DIR="$ROOT_DIR/output"
          IPA_NAME="Yet-Another-LuCI-App.ipa"

          rm -rf "$STAGING_DIR" "$OUTPUT_DIR"
          mkdir -p "$PAYLOAD_DIR" "$OUTPUT_DIR"

          # Copy compiled Runner.app bundle into Payload structure
          cp -R "$ROOT_DIR/build/ios/iphoneos/Runner.app" "$PAYLOAD_DIR/"

          # Package into standard sideloadable zip archive (.ipa)
          (
            cd "$STAGING_DIR"
            zip -r -9 "$OUTPUT_DIR/$IPA_NAME" Payload
          )

          # Generate SHA256 checksum for verification
          cd "$OUTPUT_DIR"
          shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256"
          echo "Generated IPA Checksum:"
          cat "$IPA_NAME.sha256"

      - name: Upload IPA Artifact
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Yet-Another-LuCI-App-iOS-IPA
          path: |
            output/Yet-Another-LuCI-App.ipa
            output/Yet-Another-LuCI-App.ipa.sha256
          if-no-files-found: error
          retention-days: 14
